# Same physics-v3 observations and native rewards as DQN.
total_timesteps: 500000
seed: 42
n_envs: 8
n_steps: 128
batch_size: 256
n_epochs: 4
learning_rate: 0.00025
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.03
device: auto
threads: 2
checkpoint_freq: 50000
eval_freq: 50000
n_eval_episodes: 10
eval_seed: 31000
evaluate_at_start: true
