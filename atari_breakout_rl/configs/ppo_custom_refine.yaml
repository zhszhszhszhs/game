# Fine-tune the best native-reward PPO, with no teacher or reward shaping.
total_timesteps: 200000
seed: 43
n_envs: 8
n_steps: 512
batch_size: 256
n_epochs: 4
learning_rate: 0.00005
final_learning_rate: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.1
final_clip_range: 0.05
ent_coef: 0.003
final_ent_coef: 0.001
vf_coef: 0.25
clip_range_vf: 1.0
max_grad_norm: 0.5
target_kl: 0.01
separate_critic: true
reset_timesteps: true
device: auto
threads: 2
checkpoint_freq: 50000
eval_freq: 50000
n_eval_episodes: 10
eval_seed: 31000
evaluate_at_start: true
early_stop_patience: 3
