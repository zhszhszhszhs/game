# Timesteps are agent decisions (~4 ALE frames), not raw emulator frames.
total_timesteps: 500000
seed: 42
learning_rate: 0.0001
buffer_size: 50000
learning_starts: 20000
batch_size: 32
gamma: 0.99
train_freq: 4
gradient_steps: 1
target_update_interval: 10000
exploration_fraction: 0.2
exploration_final_eps: 0.05
device: auto
checkpoint_freq: 100000
eval_freq: 50000
n_eval_episodes: 5
threads: 4
