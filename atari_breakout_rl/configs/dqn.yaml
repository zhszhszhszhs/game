# Revised stage: 500k additional decisions. With --resume, reset the stage counter
# so epsilon decays over this new stage, not the old checkpoint's history.
total_timesteps: 500000
seed: 42
learning_rate: 0.0001
buffer_size: 100000
learning_starts: 50000
batch_size: 32
gamma: 0.99
train_freq: 4
gradient_steps: 1
target_update_interval: 1000
exploration_fraction: 0.6
exploration_final_eps: 0.05
device: auto
checkpoint_freq: 50000
eval_freq: 50000
n_eval_episodes: 5
threads: 2
reset_timesteps: true
# Periodic checkpoints contain model/optimizer; replay is saved at exit only.
save_replay_buffer: true
