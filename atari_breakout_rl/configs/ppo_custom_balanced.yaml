# Test independent actor/critic clipping and robust critic regression.
total_timesteps: 500000
seed: 45
n_envs: 16
n_steps: 256
batch_size: 256
n_epochs: 4
learning_rate: 0.00003
final_learning_rate: 0.00001
gamma: 0.995
gae_lambda: 0.98
clip_range: 0.08
final_clip_range: 0.04
ent_coef: 0.0005
final_ent_coef: 0.0002
vf_coef: 0.25
clip_range_vf: null
max_grad_norm: 0.5
target_kl: 0.0075
separate_critic: true
reset_timesteps: true
reset_optimizer: true
ppo_variant: balanced
critic_max_grad_norm: 1.0
value_loss: huber
huber_delta: 10.0
paddle_hit_bonus: 0.0
life_loss_penalty: 0.0
device: auto
threads: 2
checkpoint_freq: 100000
eval_freq: 100000
eval_envs: 8
n_eval_episodes: 32
eval_seed: 31000
evaluate_at_start: true
early_stop_patience: 4
post_eval_episodes: 50
post_eval_seed: 81000
